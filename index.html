<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flevoland Open International 2026</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f5f4f0;color:#1a1a1a;min-height:100vh}
.topbar{background:#1a1a1a;color:#fff;padding:14px 20px;position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:12px}
.topbar h1{font-size:17px;font-weight:600;flex:1}
.topbar p{font-size:12px;opacity:.6}
.container{max-width:960px;margin:0 auto;padding:16px}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.stat{background:#fff;border-radius:10px;padding:12px 14px;border:1px solid #e8e6e0}
.stat-label{font-size:11px;color:#888;margin-bottom:3px;text-transform:uppercase;letter-spacing:.5px}
.stat-val{font-size:24px;font-weight:600;color:#1a1a1a}
.tabs{display:flex;gap:0;margin-bottom:16px;background:#fff;border-radius:10px;padding:4px;border:1px solid #e8e6e0}
.tab{flex:1;padding:9px 16px;font-size:14px;cursor:pointer;border:none;background:none;color:#666;border-radius:8px;font-weight:500}
.tab.active{background:#1a1a1a;color:#fff}
.controls{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.controls input,.controls select{font-size:14px;padding:8px 12px;border-radius:8px;border:1px solid #ddd;background:#fff;color:#1a1a1a;flex:1;min-width:140px}
.controls input:focus,.controls select:focus{outline:2px solid #1a1a1a;border-color:transparent}
.blok-section{background:#fff;border-radius:12px;border:1px solid #e8e6e0;margin-bottom:12px;overflow:hidden}
.blok-section-header{padding:13px 16px;display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.blok-section-header:hover{background:#f9f8f5}
.blok-label{font-size:15px;font-weight:600;color:#1a1a1a}
.blok-badge{font-size:12px;padding:3px 9px;border-radius:20px;background:#f0ede6;color:#555;font-weight:500}
.blok-times{font-size:12px;color:#999;margin-left:auto;display:flex;align-items:center;gap:4px}
.chevron{font-size:18px;color:#aaa;transition:transform .2s;margin-left:4px}
.chevron.open{transform:rotate(90deg)}
.blok-content{padding:12px;display:none}
.blok-content.open{display:block}
.poules-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.poule-card{background:#fafaf8;border:1px solid #e8e6e0;border-radius:10px;padding:12px 14px}
.poule-title{font-size:13px;font-weight:600;margin-bottom:3px}
.title-j{color:#185FA5}
.title-m{color:#993556}
.poule-meta{font-size:12px;color:#888;margin-bottom:8px;display:flex;gap:8px;align-items:center}
.mat-badge{padding:2px 7px;border-radius:6px;background:#ebebeb;color:#555;font-size:11px;font-weight:500}
.judoka-row{display:flex;align-items:center;gap:7px;padding:4px 0;border-top:1px solid #efefef}
.judoka-geb{font-size:11px;color:#aaa;min-width:22px}
.judoka-name{font-size:13px;color:#1a1a1a;flex:1;font-weight:500}
.judoka-club{font-size:11px;color:#888;text-align:right;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kyu{font-size:10px;padding:2px 5px;border-radius:4px;background:#ebebeb;color:#666;white-space:nowrap}
.kyu-dan{background:#fef3c7;color:#92400e}
mark{background:#fef08a;border-radius:2px}
.empty{text-align:center;padding:2rem;color:#aaa;font-size:14px}
.schedule-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;background:#fff;border-radius:12px;overflow:hidden;border:1px solid #e8e6e0}
th{text-align:left;padding:10px 12px;font-size:12px;font-weight:600;color:#888;background:#f9f8f5;border-bottom:1px solid #e8e6e0;text-transform:uppercase;letter-spacing:.4px}
td{padding:9px 12px;border-bottom:1px solid #f0efe9;color:#1a1a1a;vertical-align:middle}
tr:hover td{background:#f9f8f5}
tr:last-child td{border-bottom:none}
.mat-circle{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:#f0ede6;font-size:12px;font-weight:600}
@media(max-width:600px){
  .stats-row{grid-template-columns:repeat(2,1fr)}
  .blok-times{display:none}
  .poules-grid{grid-template-columns:1fr}
  th:nth-child(5),td:nth-child(5),th:nth-child(6),td:nth-child(6),th:nth-child(7),td:nth-child(7){display:none}
}
</style>
</head>

const allMats=[...new Set(rawPoules.map(p=>p.mat))].sort((a,b)=>a-b);
const ms=document.getElementById('matFilter');
allMats.forEach(m=>{const o=document.createElement('option');o.value=m;o.textContent='Mat '+m;ms.appendChild(o);});

const tj=rawPoules.reduce((s,p)=>s+p.judokas.length,0);
const tc=new Set(rawPoules.flatMap(p=>p.judokas.map(j=>j.club))).size;
document.getElementById('statsRow').innerHTML=`
<div class="stat"><div class="stat-label">Deelnemers</div><div class="stat-val">${tj}</div></div>
<div class="stat"><div class="stat-label">Poules</div><div class="stat-val">${rawPoules.length}</div></div>
<div class="stat"><div class="stat-label">Clubs</div><div class="stat-val">${tc}</div></div>
<div class="stat"><div class="stat-label">Blokken</div><div class="stat-val">5</div></div>`;

function hl(t,q){if(!q)return t;return t.replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>');}

function render(){
  const q=document.getElementById('searchInput').value.trim().toLowerCase();
  const bf=document.getElementById('blokFilter').value;
  const gf=document.getElementById('geslachtFilter').value;
  const mf=document.getElementById('matFilter').value;
  let filtered=rawPoules.filter(p=>{
    if(bf&&String(p.blok)!==bf)return false;
    if(gf&&p.geslacht!==gf)return false;
    if(mf&&String(p.mat)!==mf)return false;
    if(q){
      const mp=p.nr.toLowerCase().includes(q)||p.gew.includes(q)||p.geb.toLowerCase().includes(q);
      const mj=p.judokas.some(j=>j.naam.toLowerCase().includes(q)||j.club.toLowerCase().includes(q)||j.kyu.toLowerCase().includes(q));
      if(!mp&&!mj)return false;
    }
    return true;
  });
  const c=document.getElementById('poulesContainer');
  if(!filtered.length){c.innerHTML='<div class="empty">Geen resultaten gevonden.</div>';return;}
  const byB={};
  filtered.forEach(p=>{if(!byB[p.blok])byB[p.blok]=[];byB[p.blok].push(p);});
  let h='';
  Object.keys(byB).sort().forEach(b=>{
    const meta=blokMeta[b-1];
    const ps=byB[b];
    const td=ps.reduce((s,p)=>s+p.judokas.length,0);
    const id='blok'+b;
    h+=`<div class="blok-section">
      <div class="blok-section-header" onclick="tog('${id}',this)">
        <span class="blok-label">Blok ${b}</span>
        <span class="blok-badge">${ps.length} poules · ${td} deelnemers</span>
        <span class="blok-times">&#9200; weging ${meta.weging} &nbsp;·&nbsp; aanvang ${meta.aanvang} &nbsp;·&nbsp; einde ${meta.einde}</span>
        <span class="chevron open" id="ch${b}">&#8250;</span>
      </div>
      <div class="blok-content open" id="${id}">
        <div class="poules-grid">`;
    ps.forEach(p=>{
      const mj=q?p.judokas.filter(j=>j.naam.toLowerCase().includes(q)||j.club.toLowerCase().includes(q)):p.judokas;
      const sj=q&&mj.length>0?mj:p.judokas;
      h+=`<div class="poule-card">
        <div class="poule-title ${p.geslacht==='j'?'title-j':'title-m'}">${p.geslacht==='j'?'Jongens/Heren':'Meisjes/Dames'} · ${hl(p.gew,q)}</div>
        <div class="poule-meta"><span class="mat-badge">Mat ${p.mat}</span><span>${hl(p.geb,q)}</span><span style="margin-left:auto">${p.judokas.length} deeln.</span></div>`;
      sj.forEach(j=>{
        h+=`<div class="judoka-row">
          <span class="judoka-geb">'${j.geb}</span>
          <span class="judoka-name">${hl(j.naam,q)}</span>
          <span class="judoka-club">${hl(j.club,q)}</span>
          <span class="kyu ${j.kyu&&j.kyu.includes('Dan')?'kyu-dan':''}">${j.kyu}</span>
        </div>`;
      });
      h+=`</div>`;
    });
    h+=`</div></div></div>`;
  });
  c.innerHTML=h;
}

function tog(id,hdr){
  const el=document.getElementById(id);
  const ch=hdr.querySelector('.chevron');
  const open=el.classList.toggle('open');
  ch.classList.toggle('open',open);
}

function buildSchedule(){
  const data=rawPoules.map(p=>({...p,aanvang:blokMeta[p.blok-1].aanvang,einde:blokMeta[p.blok-1].einde}));
  data.sort((a,b)=>a.blok-b.blok||a.mat-b.mat);
  let prevB=null;
  document.getElementById('scheduleBody').innerHTML=data.map(s=>{
    const bl=s.blok!==prevB?(prevB=s.blok,`<strong>Blok ${s.blok}</strong>`):'';
    const gl=s.geslacht==='j'?'<span style="color:#185FA5;font-weight:600">J</span>':'<span style="color:#993556;font-weight:600">M</span>';
    return`<tr><td>${bl}</td><td><span class="mat-circle">${s.mat}</span></td><td>${gl} ${s.nr}</td><td>${s.gew} <span style="color:#aaa;font-size:11px">${s.geb}</span></td><td>${s.weging}</td><td>${s.aanvang}</td><td>${s.einde}</td><td style="text-align:center;font-weight:600">${s.judokas.length}</td></tr>`;
  }).join('');
}

function switchTab(n,btn){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tab-poules').style.display=n==='poules'?'':'none';
  document.getElementById('tab-schema').style.display=n==='schema'?'':'none';
}

render();buildSchedule();
</script>
